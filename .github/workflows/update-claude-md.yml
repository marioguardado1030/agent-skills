name: CLAUDE.md Validation

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'skills/**'
      - 'agents/**'
      - '.claude/commands/**'
      - 'hooks/**'
      - 'references/**'
      - 'plugin.json'
      - '.github/workflows/update-claude-md.yml'
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'skills/**'
      - 'agents/**'
      - '.claude/commands/**'
      - 'hooks/**'
      - 'references/**'
      - 'plugin.json'
      - '.github/workflows/update-claude-md.yml'

permissions:
  contents: read

jobs:
  validate-claude-md:
    name: Validate CLAUDE.md against filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check CLAUDE.md exists and is non-empty
        run: |
          if [ ! -f CLAUDE.md ]; then
            echo "ERROR: CLAUDE.md is missing"
            exit 1
          fi
          SIZE=$(wc -c < CLAUDE.md)
          echo "CLAUDE.md: ${SIZE} bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: CLAUDE.md is too small (${SIZE} bytes)"
            exit 1
          fi

      - name: Check all skill directories are documented in CLAUDE.md
        run: |
          MISSING=0
          for DIR in skills/*/; do
            SKILL=$(basename "$DIR")
            if ! grep -qF "$SKILL" CLAUDE.md; then
              echo "WARNING: Skill '$SKILL' not mentioned in CLAUDE.md"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "Some skills are not documented in CLAUDE.md."
            echo "Run 'node scripts/update-claude-md.js' to refresh the AUTO:skills block,"
            echo "or add the skill names to CLAUDE.md manually."
            exit 1
          fi
          echo "All skills are documented in CLAUDE.md."

      - name: Check all agent files are documented in CLAUDE.md
        run: |
          MISSING=0
          for FILE in agents/*.md; do
            [ -f "$FILE" ] || continue
            AGENT=$(basename "$FILE" .md)
            if ! grep -qF "$AGENT" CLAUDE.md; then
              echo "WARNING: Agent '$AGENT' not mentioned in CLAUDE.md"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "All agents are documented in CLAUDE.md."

      - name: Check required sections are present
        run: |
          MISSING=0
          for SECTION in \
            "## Installation" \
            "## Skills Catalog" \
            "## Agents" \
            "## Slash Commands" \
            "## References" \
            "## Conventions" \
            "## Contributing"; do
            if ! grep -qF "$SECTION" CLAUDE.md; then
              echo "ERROR: Missing section: $SECTION"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "All required sections present."
